<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-labelledby="title desc">
  <title id="title">app-tail</title>
  <desc id="desc">Every private network you use, on one machine, on your terms. Tailscale, WireGuard and OpenVPN connections meet at one shielded agent.</desc>
  <style>
    :root {
      --bg-a: #04060c;
      --bg-b: #0b1324;
      --grid: #38bdf8;
      --grid-alpha: 0.07;
      --text: #e6edf7;
      --muted: #8b9ab3;
      --accent: #22d3ee;
      --accent-2: #a78bfa;
      --ok: #34d399;
      --node: #0e1a2f;
      --chip: #0c1628;
      --chip-line: #1e3352;
    }
    .bg-a { stop-color: var(--bg-a); }
    .bg-b { stop-color: var(--bg-b); }
    .grid { stroke: var(--grid); stroke-opacity: var(--grid-alpha); }
    .mono { font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
    .sans { font-family: Inter, "SF Pro Display", -apple-system, "Segoe UI", system-ui, sans-serif; }
    .eyebrow { fill: var(--accent); font-size: 14px; letter-spacing: 4px; }
    .tagline { fill: var(--text); font-size: 28px; font-weight: 600; }
    .sub { fill: var(--muted); font-size: 18px; }
    .chip { fill: var(--chip); stroke: var(--chip-line); }
    .chip-key { fill: var(--muted); font-size: 12px; letter-spacing: 2px; }
    .chip-val { fill: var(--text); font-size: 13px; }
    .dot { fill: var(--ok); }
    .cursor { fill: var(--accent); animation: blink 1.1s steps(1) infinite; }
    .wire { stroke: var(--accent); stroke-opacity: 0.25; stroke-width: 1.5; fill: none; }
    .flow { stroke: var(--accent); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-dasharray: 1 13; animation: flow 1.4s linear infinite; }
    .flow.in { stroke: var(--accent-2); animation-direction: reverse; animation-duration: 1.9s; }
    .ring { fill: none; stroke: var(--accent); stroke-opacity: 0.35; }
    .ring-2 { fill: none; stroke: var(--accent-2); stroke-opacity: 0.3; }
    .spin { transform-box: view-box; transform-origin: 1010px 230px; animation: spin 48s linear infinite; }
    .spin.rev { animation-duration: 70s; animation-direction: reverse; }
    .hex { fill: var(--node); stroke: var(--accent); stroke-width: 2; }
    .shield { fill: none; stroke: var(--text); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .check { fill: none; stroke: var(--ok); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .sat { fill: var(--node); stroke: var(--accent-2); stroke-width: 1.5; }
    .sat-label { fill: var(--text); font-size: 15px; font-weight: 700; }
    .sat-name { fill: var(--muted); font-size: 12px; letter-spacing: 2.5px; }
    .halo { fill: url(#halo); }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-in-out infinite; }
    .scan { fill: url(#scan); animation: scan 7s linear infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.55; transform: scale(0.92); } 50% { opacity: 1; transform: scale(1.06); } }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(480px); } }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .flow, .spin, .pulse, .scan { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="bg-a"/>
      <stop offset="1" class="bg-b"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="fade" cx="0.72" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="grid-mask">
      <rect width="1280" height="460" fill="url(#fade)"/>
    </mask>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" class="grid" fill="none" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="460" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="460" fill="url(#bg)"/>
    <rect width="1280" height="460" fill="url(#grid)" mask="url(#grid-mask)"/>
    <rect class="scan" x="0" y="0" width="1280" height="40"/>

    <text class="mono eyebrow" x="80" y="112">SECURE MULTI-NETWORK AGENT</text>
    <text class="mono" x="76" y="200" font-size="92" font-weight="800" fill="url(#word)" textLength="440" lengthAdjust="spacingAndGlyphs">app-tail</text>
    <rect class="cursor" x="530" y="128" width="26" height="78" rx="3"/>
    <text class="sans tagline" x="80" y="256">Every private network you use. One machine. Your rules.</text>
    <text class="sans sub" x="80" y="292">Tailscale, WireGuard and OpenVPN side by side, each with its own reach.</text>
    <text class="sans sub" x="80" y="318">Encrypted DNS, blocklists and threat protection built in.</text>

    <g class="mono" transform="translate(80 356)">
      <rect class="chip" width="214" height="40" rx="20"/>
      <circle class="dot pulse" cx="22" cy="20" r="5"/>
      <text class="chip-key" x="38" y="24.5">API</text>
      <text class="chip-val" x="72" y="24.5">token-locked</text>

      <rect class="chip" x="228" width="252" height="40" rx="20"/>
      <circle class="dot pulse" cx="250" cy="20" r="5" style="animation-delay: 0.6s"/>
      <text class="chip-key" x="266" y="24.5">HELPER</text>
      <text class="chip-val" x="328" y="24.5">caller-verified</text>

      <rect class="chip" x="494" width="236" height="40" rx="20"/>
      <circle class="dot pulse" cx="516" cy="20" r="5" style="animation-delay: 1.2s"/>
      <text class="chip-key" x="532" y="24.5">SECRETS</text>
      <text class="chip-val" x="602" y="24.5">owner-only</text>
    </g>

    <circle class="halo" cx="1010" cy="230" r="170"/>
    <g class="spin">
      <circle class="ring" cx="1010" cy="230" r="112" stroke-dasharray="3 9"/>
      <circle cx="1010" cy="118" r="3.5" fill="#22d3ee"/>
    </g>
    <g class="spin rev">
      <circle class="ring-2" cx="1010" cy="230" r="138" stroke-dasharray="40 14 4 14"/>
    </g>

    <path class="wire" d="M1010 230 L1010 62"/>
    <path class="wire" d="M1010 230 L1156 314"/>
    <path class="wire" d="M1010 230 L864 314"/>
    <path class="flow" d="M1010 168 L1010 92"/>
    <path class="flow in" d="M1064 261 L1130 299"/>
    <path class="flow" d="M956 261 L890 299"/>

    <g transform="translate(1010 230)">
      <polygon class="hex" points="0,-62 53.7,-31 53.7,31 0,62 -53.7,31 -53.7,-31"/>
      <path class="shield" d="M0,-26 L21,-17 L21,1 C21,14 11,22 0,27 C-11,22 -21,14 -21,1 L-21,-17 Z"/>
      <path class="check" d="M-9,0 L-2,7 L10,-7"/>
    </g>

    <g transform="translate(1010 62)">
      <circle class="sat" r="30"/>
      <text class="mono sat-label" text-anchor="middle" y="5">TS</text>
      <text class="mono sat-name" x="44" y="5">TAILSCALE</text>
    </g>
    <g transform="translate(1156 314)">
      <circle class="sat" r="30"/>
      <text class="mono sat-label" text-anchor="middle" y="5">WG</text>
      <text class="mono sat-name" text-anchor="middle" y="56">WIREGUARD</text>
    </g>
    <g transform="translate(864 314)">
      <circle class="sat" r="30"/>
      <text class="mono sat-label" text-anchor="middle" y="5">OV</text>
      <text class="mono sat-name" text-anchor="middle" y="56">OPENVPN</text>
    </g>
  </g>
</svg>
